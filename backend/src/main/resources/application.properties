spring.application.name=planet-pulse

# Load environment variables from .env file
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:planet_pulse}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# REST Countries API
rest-countries.api.base-url=${REST_COUNTRIES_API_BASE_URL:https://api.restcountries.com/countries}
rest-countries.api.version=${REST_COUNTRIES_API_VERSION:5}
rest-countries.api.key=${REST_COUNTRIES_API_KEY:}
