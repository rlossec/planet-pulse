<form id="indicator-form" class="card card-body mb-4">
    <div class="row g-3">
        <div class="col-12 col-md-4">
            <label for="year" class="form-label">Year</label>
            <input type="number" id="year" name="year" class="form-control"
                   value="2026" min="1800" max="2150" required>
        </div>
        <div class="col-12 col-md-4">
            <label for="co2" class="form-label">CO2 emissions (metric tons per capita)</label>
            <input type="number" id="co2" name="co2" class="form-control" placeholder="min: 0"
                   min="0" step="any">
        </div>
        <div class="col-12 col-md-4">
            <label for="renewable-energy" class="form-label">Renewable energy (% of final consumption)</label>
            <input type="number" id="renewable-energy" name="renewableEnergy" class="form-control" placeholder="min: 0, max: 100"
                   min="0" max="100" step="any">
        </div>
        <div class="col-12 col-md-4">
            <label for="forest" class="form-label">Forest area (% of land area)</label>
            <input type="number" id="forest" name="forest" class="form-control" placeholder="min: 0, max: 100"
                   min="0" max="100" step="any">
        </div>
        <div class="col-12 col-md-4">
            <label for="pm25" class="form-label">PM2.5 (µg/m³)</label>
            <input type="number" id="pm25" name="pm25" class="form-control" placeholder="min: 0"
                   min="0" step="any">
        </div>
    </div>
    <p id="validation-error" class="alert alert-danger mt-3 mb-0 d-none" role="alert">
        Enter a value greater than 0 for at least one indicator.
    </p>
    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success">Save</button>
        <button id="cancel-form-btn" type="button" class="btn btn-outline-secondary">Cancel</button>
    </div>
</form>
