$kind: http-request
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Error in Renewable energy decimal\", function () {\r

      \    const body = pm.response.json();\r

      \    pm.expect(body.errors.renewableEnergy).to.eql(\"Renewable energy must have at most 1 decimal.\");\r

      });"
    language: text/javascript
order: 3000
method: POST
url: "{{baseUrl}}{{indicators}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isoCode2": "FR",
      "year": 2021,
      "renewableEnergy": 12.34
    }
