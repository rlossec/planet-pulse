$kind: http-request
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 409\", function () {\r

      \    pm.response.to.have.status(409);\r

      });\r

      \r

      pm.test(\"Error this country and year exists\", function () {\r

      \    pm.expect(pm.response.json().message)\r

      \        .to.eql(\"Indicators already exist for this country and year.\");\r

      });"
    language: text/javascript
order: 7000
method: POST
url: "{{baseUrl}}{{indicators}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isoCode2": "FR",
      "year": 2020,
      "co2": 500,
      "renewableEnergy": 12.3,
      "forest": 31.25,
      "pm25": 12
    }
