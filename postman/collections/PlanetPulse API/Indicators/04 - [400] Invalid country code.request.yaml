$kind: http-request
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Error is on country code\", function () {\r

      \    const body = pm.response.json();\r

      \    pm.expect(body.errors.isoCode2).to.eql(\"Country code must be 2 uppercase letters.\");\r

      });"
    language: text/javascript
order: 4000
method: POST
url: "{{baseUrl}}{{indicators}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isoCode2": "fr",
      "year": 2021,
      "co2": 100
    }
