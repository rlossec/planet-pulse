$kind: http-request
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Message says the country is unknown\", function () {\r

      \    pm.expect(pm.response.json().message).to.eql(\"Unknown country code.\");\r

      });"
    language: text/javascript
order: 5000
method: POST
url: "{{baseUrl}}{{indicators}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isoCode2": "ZZ",
      "year": 2021,
      "co2": 100
    }
